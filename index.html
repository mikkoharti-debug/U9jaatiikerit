<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4f2f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Jaa-Tiikerit ryhmajakaja</title></head><body><main><header class="hero"><img src="jaa-tiikerit-logo.png" alt="Jää-Tiikerit logo"><div><h1>Jää-Tiikerit</h1><p>Ryhmäjakaja</p></div></header><section><h2>1. Osallistujalistan kuva</h2><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" hidden></section><section><div class="bar"><h2>2. Valitse mukana olevat</h2><div><button id="all">Kaikki</button><button id="none">Tyhjennä</button></div></div><div id="players"></div><div class="addplayer"><input id="newName" type="text" placeholder="Uuden pelaajan nimi"><select id="newLevel"><option value="1">Taso 1</option><option value="2">Taso 2</option><option value="3" selected>Taso 3</option><option value="4">Taso 4</option><option value="5">Taso 5</option></select><label><input id="newGoalie" type="checkbox"> MV</label><button id="addPlayer" type="button">+ Lisää pelaaja</button></div><button class="primary" id="divide">Jaa kolmeen ryhmään</button><p id="status"></p></section><section id="groupsSec" hidden><h2>3. Tasoryhmät</h2><div id="groups" class="grid"></div><h3>Muokkaa jakoa</h3><div class="swap"><select id="a"></select><select id="b"></select><button id="swap">Vaihda</button></div><button class="primary" id="shirts">Tee tummat ja vaaleat</button></section><section id="final" hidden><h2>4. Valmis pelijako</h2><div class="grid"><div class="goal"><h3>🥅 Maalivahdit</h3><div id="goalies"></div></div><div class="dark"><h3>⚫ Tummat</h3><div id="darks"></div></div><div class="light"><h3>⚪ Vaaleat</h3><div id="lights"></div></div></div><button id="shuffle">🔀 Sekoita paitavärit</button><button id="copy">Kopioi lista</button><label for="text">Kopioitava lista</label><textarea id="text" rows="14" readonly></textarea><p id="copyStatus"></p></section></main><script src="app.js"></script></body></html>
